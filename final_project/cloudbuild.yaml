# cloudbuild.yaml
#
# Builds the image, pushes it to Artifact Registry, and deploys to Cloud Run.
# Trigger manually with:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_INSTANCE_CONNECTION_NAME="PROJECT_ID:southamerica-west1:users-and-conversations",_CHROMA_BUCKET="YOUR_PROJECT-chroma-db"
#
# Or connect this file to a GitHub trigger for build-on-push.

steps:
  # 1. Build the image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "southamerica-west1-docker.pkg.dev/$PROJECT_ID/users-and-conversations-repo/users-and-conversations:$BUILD_ID"
      - "-t"
      - "southamerica-west1-docker.pkg.dev/$PROJECT_ID/users-and-conversations-repo/users-and-conversations:latest"
      - "."

  # 2. Push both tags
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "southamerica-west1-docker.pkg.dev/$PROJECT_ID/users-and-conversations-repo/users-and-conversations:$BUILD_ID"
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "southamerica-west1-docker.pkg.dev/$PROJECT_ID/users-and-conversations-repo/users-and-conversations:latest"

  # 3. Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "users-and-conversations"
      - "--image=southamerica-west1-docker.pkg.dev/$PROJECT_ID/users-and-conversations-repo/users-and-conversations:$BUILD_ID"
      - "--region=southamerica-west1"
      - "--add-cloudsql-instances=${_INSTANCE_CONNECTION_NAME}"
      - "--add-volume=name=chroma-vol,type=cloud-storage,bucket=${_CHROMA_BUCKET}"
      - "--add-volume-mount=volume=chroma-vol,mount-path=/mnt/chroma"
      - "--set-secrets=DB_PASSWORD=db-password:latest,API_KEY=llm-api-key:latest"
      - "--set-env-vars=INSTANCE_CONNECTION_NAME=${_INSTANCE_CONNECTION_NAME},CHROMA_PERSIST_DIR=/mnt/chroma/chroma_db,DB_USER=postgres,DB_NAME=users-and-conversations"
      - "--allow-unauthenticated"
      - "--session-affinity"
      - "--max-instances=1"

images:
  - "southamerica-west1-docker.pkg.dev/$PROJECT_ID/users-and-conversations-repo/users-and-conversations:$BUILD_ID"
  - "southamerica-west1-docker.pkg.dev/$PROJECT_ID/users-and-conversations-repo/users-and-conversations:latest"

substitutions:
  _INSTANCE_CONNECTION_NAME: "PROJECT_ID:southamerica-west1:users-and-conversations"
  _CHROMA_BUCKET: "YOUR_PROJECT-chroma-db"

options:
  logging: CLOUD_LOGGING_ONLY
