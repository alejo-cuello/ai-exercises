# cloudbuild.yaml
#
# Builds the image, pushes it to Artifact Registry, and deploys to Cloud Run.
# Trigger manually with:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_INSTANCE_CONNECTION_NAME="PROJECT_ID:us-central1:chatbot-db",_CHROMA_BUCKET="YOUR_PROJECT-chroma-db"
#
# Or connect this file to a GitHub trigger for build-on-push.

steps:
  # 1. Build the image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/chatbot-repo/chatbot:$SHORT_SHA"
      - "-t"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/chatbot-repo/chatbot:latest"
      - "."

  # 2. Push both tags
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/chatbot-repo/chatbot:$SHORT_SHA"
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/chatbot-repo/chatbot:latest"

  # 3. Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "chatbot"
      - "--image=us-central1-docker.pkg.dev/$PROJECT_ID/chatbot-repo/chatbot:$SHORT_SHA"
      - "--region=us-central1"
      - "--add-cloudsql-instances=${_INSTANCE_CONNECTION_NAME}"
      - "--add-volume=name=chroma-vol,type=cloud-storage,bucket=${_CHROMA_BUCKET}"
      - "--add-volume-mount=volume=chroma-vol,mount-path=/mnt/chroma"
      - "--set-secrets=DB_PASSWORD=db-password:latest,API_KEY=llm-api-key:latest"
      - "--set-env-vars=INSTANCE_CONNECTION_NAME=${_INSTANCE_CONNECTION_NAME},CHROMA_PERSIST_DIR=/mnt/chroma/chroma_db,DB_USER=postgres,DB_NAME=chatbot"
      - "--allow-unauthenticated"
      - "--session-affinity"
      - "--max-instances=1"

images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/chatbot-repo/chatbot:$SHORT_SHA"
  - "us-central1-docker.pkg.dev/$PROJECT_ID/chatbot-repo/chatbot:latest"

substitutions:
  _INSTANCE_CONNECTION_NAME: "PROJECT_ID:us-central1:chatbot-db"
  _CHROMA_BUCKET: "YOUR_PROJECT-chroma-db"

options:
  logging: CLOUD_LOGGING_ONLY
